<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101318"><title>自己PR収録スタジオ・iPhone版</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#1b2029;--line:#303846;--fg:#eef2f7;--muted:#aab4c2;--yellow:#f5c84b;--red:#e94b55;--green:#52c58e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding:14px 14px calc(100px + env(safe-area-inset-bottom))}.wrap{max-width:850px;margin:auto;display:grid;gap:14px}.hint,.muted,.small{color:var(--muted)}.hint{text-align:center;font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.prompter{height:34vh;min-height:230px;max-height:420px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#000;touch-action:manipulation}.track{position:absolute;left:0;right:0;top:0;padding:0 20px;will-change:transform}.track p{font-size:40px;line-height:1.55;font-weight:750;margin:0 0 .7em;white-space:pre-wrap}.guide{position:absolute;top:28%;left:0;right:0;border-top:1px dashed var(--yellow);opacity:.6;pointer-events:none}.fade{position:absolute;left:0;right:0;height:20%;pointer-events:none}.fade.top{top:0;background:linear-gradient(#000,transparent)}.fade.bottom{bottom:0;height:30%;background:linear-gradient(transparent,#000)}.studio{display:grid;gap:12px}.camera{position:relative;width:100%;max-width:600px;margin:auto;aspect-ratio:16/9;background:#050608;border-radius:10px;overflow:hidden}.camera.portrait{max-width:330px;aspect-ratio:9/16}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.recbadge{position:absolute;top:10px;left:10px;background:#000b;border-radius:20px;padding:3px 10px;color:#fff;font-size:12px}.controls{display:grid;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.seg button[aria-pressed=true]{background:var(--yellow);color:#111}.btn{border:1px solid var(--line);border-radius:9px;background:#29313e;color:var(--fg);padding:11px 14px;min-height:46px;font-weight:700;font-size:14px}.btn:disabled{opacity:.4}.btn.primary{background:var(--red);border-color:var(--red);color:white}.btn.stop{background:white;color:#111}.field{display:grid;grid-template-columns:6em 1fr 4em;gap:8px;align-items:center;font-size:13px}.field output{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--yellow);min-height:32px}.timer{font: bold 34px ui-monospace,monospace;font-variant-numeric:tabular-nums}.timer small{font:13px -apple-system,sans-serif;color:var(--muted)}textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0d1117;color:var(--fg);padding:12px;font:15px/1.7 inherit}textarea{min-height:150px}select{min-height:44px}.take{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;display:grid;gap:8px}.take video{width:100%;max-height:360px;background:#000;border-radius:8px}.save{display:inline-block;background:var(--green);color:#07150e;text-decoration:none;font-weight:800;padding:10px 14px;border-radius:8px;width:max-content}.bar{height:5px;background:#343b47;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);width:0}.actions{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#181c23f2;border-top:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}.actions .btn{min-height:54px}.status{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.warning{color:#ffd27a}.title{font-weight:800;margin:0 0 8px}.hidden{display:none!important}
</style>
</head><body><main class="wrap">
<div class="hint">カメラの近くに原稿を表示します。黄色い線付近を目安に読んでください。</div>
<section id="prompter" class="prompter"><div id="track" class="track"><p>下の「原稿を編集」から原稿を入力してください。</p></div><div class="guide"></div><div class="fade top"></div><div class="fade bottom"></div></section>
<section class="studio">
<div id="camera" class="camera"><video id="preview" autoplay muted playsinline></video><div id="recbadge" class="recbadge hidden">● REC</div></div>
<div class="panel controls">
<div class="row seg"><button class="btn" id="land" aria-pressed="true">横動画 16:9</button><button class="btn" id="port" aria-pressed="false">縦動画 9:16</button></div>
<div><div class="timer"><span id="elapsed">0:00</span> <small>/ 目標 <span id="goalText">1:00</span></small></div><div class="bar"><span id="progress"></span></div></div>
<label class="field">流す速さ<input id="goal" type="range" min="40" max="120" value="60"><output id="goalOut">60秒</output></label>
<label class="field">文字サイズ<input id="fontSize" type="range" min="22" max="64" step="2" value="40"><output id="fontOut">40px</output></label>
<div><div class="small">マイク入力</div><select id="mic"><option value="">iPhoneの標準マイク（接続中のイヤホンマイクを含む）</option></select><div id="micStatus" class="status">iPhoneにイヤホンマイクを接続してから「入力を更新」を押してください。</div><button class="btn" id="refreshMic" type="button">入力を更新</button></div>
<div class="row"><button class="btn" id="flip">カメラ切替</button><button class="btn" id="reset">最初へ</button></div>
<div id="status" class="status">カメラとマイクの使用を許可してください。</div>
</div></section>
<section class="panel"><h3 class="title">原稿を編集</h3><textarea id="script" placeholder="ここに自己PRの原稿を貼り付けてください。段落ごとに改行できます。"></textarea><div class="small" id="chars">0字</div></section>
<section class="panel"><h3 class="title">撮ったテイク</h3><div id="takes" class="small">まだ録画はありません。</div><p class="small warning">動画はこのページを閉じると消える場合があります。録画後、必ず「ビデオを保存」または「ファイルに保存」でiPhoneに保存してください。</p></section>
</main>
<div class="actions"><button class="btn primary" id="record" disabled>● 録画開始</button><button class="btn" id="practice">練習</button><button class="btn" id="pause" disabled>一時停止</button></div>
<script>
(()=>{
const $=id=>document.getElementById(id);const video=$('preview');let stream=null,recorder=null,chunks=[],raf=0,last=0,elapsed=0,mode='idle',pos=0,goal=60,portrait=false,facing='user',takeNo=0,selectedMic='';
const store={get(k,d){try{return localStorage.getItem('priphone_'+k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem('priphone_'+k,v)}catch(e){}}};
$('script').value=store.get('script','');$('goal').value=store.get('goal','60');$('fontSize').value=store.get('font','40');goal=+$('goal').value;
function fmt(s){let m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+String(r).padStart(2,'0')}
function updateGoal(){goal=+$('goal').value;$('goalOut').textContent=goal+'秒';$('goalText').textContent=fmt(goal);store.set('goal',goal)}
function render(){let text=$('script').value;let lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);$('track').innerHTML='';if(!lines.length)lines=['原稿を編集から入力してください'];for(const line of lines){let p=document.createElement('p');p.textContent=line;$('track').append(p)}$('chars').textContent=text.replace(/\s/g,'').length+'字';store.set('script',text);applyPos()}
function applyPos(){let t=$('track'),max=Math.max(0,t.scrollHeight-$('prompter').clientHeight*.72);t.style.transform=`translateY(${-pos*max}px)`}
function reset(){elapsed=0;pos=0;$('elapsed').textContent='0:00';$('progress').style.width='0%';applyPos()}
function tick(now){let dt=Math.min(.1,(now-last)/1000||0);last=now;if(mode==='practice'||mode==='rec'){elapsed+=dt;pos=Math.min(1,elapsed/goal);$('elapsed').textContent=fmt(elapsed);$('progress').style.width=Math.min(100,elapsed/goal*100)+'%';applyPos()}raf=requestAnimationFrame(tick)}
function sync(){ $('record').disabled=!stream||mode==='practice'||mode==='paused';$('record').textContent=mode==='rec'?'■ 録画停止':'● 録画開始';$('record').classList.toggle('stop',mode==='rec');$('practice').textContent=mode==='practice'?'練習停止':'練習';$('pause').disabled=!(mode==='practice'||mode==='paused');$('pause').textContent=mode==='paused'?'再開':'一時停止';$('recbadge').classList.toggle('hidden',mode!=='rec') }
async function countdown(){mode='countdown';sync();let c=document.createElement('div');c.style.cssText='position:fixed;inset:0;display:grid;place-items:center;background:#000b;font-size:100px;color:#f5c84b;z-index:20';document.body.append(c);for(let n=3;n>0;n--){c.textContent=n;await new Promise(r=>setTimeout(r,800))}c.remove()}
async function startCamera(){try{let audio=selectedMic?{deviceId:{exact:selectedMic},echoCancellation:true,noiseSuppression:true}:{echoCancellation:true,noiseSuppression:true};const session=navigator.audioSession;if(session&&'type'in session){try{session.type='auto'}catch(e){}}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio});if(session&&'type'in session){try{session.type='play-and-record'}catch(e){}}video.srcObject=stream;await video.play();$('status').textContent='カメラ・マイク使用中。録画できます。イヤホン接続時の入力はiOSの音声ルーティングに従います。';$('record').disabled=false;await refreshMics()}catch(e){$('status').textContent='カメラ／マイクを開始できません：'+e.message;stream=null;$('record').disabled=true}}
async function refreshMics(){try{let devices=await navigator.mediaDevices.enumerateDevices(),inputs=devices.filter(d=>d.kind==='audioinput'),sel=$('mic'),old=selectedMic;sel.innerHTML='<option value="">iPhoneの標準入力（イヤホン接続時はiOSの選択に従う）</option>';for(let d of inputs){let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'マイク '+(sel.length);sel.append(o)}if(old&&[...sel.options].some(o=>o.value===old))sel.value=old;$('micStatus').textContent=inputs.length+'個の音声入力を検出。イヤホンマイクが表示されない場合は標準入力を選んでください。'}catch(e){$('micStatus').textContent='マイク一覧を取得できません。標準入力を使用します。'}}
function stopTracks(s){s?.getTracks().forEach(t=>t.stop())}
async function startRecording(){if(!stream||mode!=='idle')return;reset();await countdown();try{chunks=[];let options={};let types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'];let type=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));if(type)options.mimeType=type;options.videoBitsPerSecond=4500000;recorder=new MediaRecorder(stream,options);recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onerror=e=>{$('status').textContent='録画エラー：'+(e.error?.message||'不明なエラー')};recorder.onstop=saveTake;recorder.start(1000);mode='rec';sync();$('status').textContent='録画中です。録画停止を押すとテイクに追加されます。'}catch(e){mode='idle';sync();$('status').textContent='録画を開始できません：'+e.message}}
function saveTake(){let type=recorder?.mimeType||chunks[0]?.type||'video/mp4',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm';takeNo++;let box=document.createElement('div');box.className='take';let v=document.createElement('video');v.src=url;v.controls=true;v.playsInline=true;let label=document.createElement('b');label.textContent='テイク '+takeNo+'（'+fmt(elapsed)+'）';let a=document.createElement('a');a.className='save';a.href=url;a.download='自己PR_テイク'+takeNo+'.'+ext;a.textContent='動画を保存（.'+ext+'）';let share=document.createElement('button');share.className='btn';share.textContent='共有して写真／ファイルに保存';share.onclick=async()=>{try{let file=new File([blob],'自己PR_テイク'+takeNo+'.'+ext,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'自己PR動画'});}else{a.click();}}catch(e){if(e.name!=='AbortError')$('status').textContent='共有できませんでした。下の保存リンクをお試しください。'}};let note=document.createElement('div');note.className='small';note.textContent='iPhoneでは「共有して写真／ファイルに保存」を押すと保存先を選べます。';box.append(label,v,share,a,note);if(takeNo===1)$('takes').innerHTML='';$('takes').prepend(box);$('status').textContent='録画をテイクに追加しました。動画をiPhoneに保存してください。';chunks=[];}
function stopRecording(){if(mode!=='rec'||!recorder)return;recorder.stop();mode='idle';sync()}
$('record').onclick=()=>mode==='rec'?stopRecording():startRecording();$('practice').onclick=async()=>{if(mode==='practice'||mode==='paused'){mode='idle';sync();return}if(mode==='idle'){reset();await countdown();mode='practice';sync()}};$('pause').onclick=()=>{mode=mode==='paused'?'practice':'paused';sync()};$('reset').onclick=()=>{if(mode==='rec')return;mode='idle';reset();sync()};$('goal').oninput=()=>{updateGoal()};$('fontSize').oninput=()=>{$('track').style.setProperty('--unused','');document.querySelectorAll('.track p').forEach(p=>p.style.fontSize=$('fontSize').value+'px');$('fontOut').textContent=$('fontSize').value+'px';store.set('font',$('fontSize').value);applyPos()};$('script').oninput=render;
$('land').onclick=()=>{portrait=false;$('camera').classList.remove('portrait');$('land').setAttribute('aria-pressed','true');$('port').setAttribute('aria-pressed','false')};$('port').onclick=()=>{portrait=true;$('camera').classList.add('portrait');$('land').setAttribute('aria-pressed','false');$('port').setAttribute('aria-pressed','true')};$('flip').onclick=async()=>{if(mode==='rec')return;facing=facing==='user'?'environment':'user';stopTracks(stream);stream=null;await startCamera()};$('refreshMic').onclick=refreshMics;$('mic').onchange=async()=>{selectedMic=$('mic').value;if(mode==='rec')return;stopTracks(stream);stream=null;await startCamera()};
$('goal').value=store.get('goal','60');$('fontSize').value=store.get('font','40');$('track').style.setProperty('--unused','');document.querySelectorAll('.track p').forEach(p=>p.style.fontSize=$('fontSize').value+'px');$('fontOut').textContent=$('fontSize').value+'px';updateGoal();render();last=performance.now();raf=requestAnimationFrame(tick);if(navigator.mediaDevices?.addEventListener)navigator.mediaDevices.addEventListener('devicechange',refreshMics);startCamera();window.addEventListener('beforeunload',()=>{cancelAnimationFrame(raf);stopTracks(stream)});
})();
</script></body></html>
